name: release

# 发布 create-store-app(npm)。
#
# 触发:推 v* tag(版本必须与 package.json 一致),或手动 dispatch(仅校验)。
# 凭证:
#   - npm:NPM_TOKEN secret(仓库 Settings → Secrets → Actions;只此一处,禁入仓库/文档)
# 首发前提:双远端(gitee 事实源 + github 镜像)已建、仓库 secrets 已配、tag 由 gitee 打并 sync。
# 形态对齐 store-api/.github/workflows/release.yml(皮肤层发布先例;本仓无 py 端)。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm publish (create-store-app)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance(OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json version $PKG 不一致" >&2
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Check SPEC snippets (carrier consistency)
        run: node tools/check-spec-snippets.js
      - name: Pack & inspect
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
